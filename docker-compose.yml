services:
  postgres:
    image: postgres:16
    container_name: billpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billpilot
      POSTGRES_PASSWORD: billpilot
      POSTGRES_DB: billpilot
    ports:
      - "5432:5432"
    volumes:
      - billpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billpilot -d billpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  billpilot_pgdata:
